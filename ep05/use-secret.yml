---
# Needs ep05/secrets.yml, created on camera with:
#   ansible-vault encrypt_string 'S3cret-demo' --name app_db_password > secrets.yml
# and a Vault credential in AWX holding the vault password.
- name: Use a vaulted secret without showing it
  hosts: localhost
  gather_facts: false
  vars_files:
    - secrets.yml
  tasks:
    - name: Prove the secret was decrypted
      ansible.builtin.debug:
        msg: "app_db_password is {{ app_db_password | length }} characters long"
