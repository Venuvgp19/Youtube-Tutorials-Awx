# Inventory kept in Git. AWX reads it through an inventory source
# (Source: "Sourced from a Project", file ep06/inventory/hosts.yml).
# Home lab: all three names point at node2, so every host is reachable
# with the lab-ssh credential. In real life each would be its own server.
all:
  children:
    homelab:
      children:
        web:
          hosts:
            web1:
              ansible_host: 192.168.100.103
            web2:
              ansible_host: 192.168.100.103
        db:
          hosts:
            db1:
              ansible_host: 192.168.100.103
