<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../fonts/Inter-Bold.otf);font-weight:700}
@font-face{font-family:Inter;src:url(../fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:DVMono;src:url(../fonts/DejaVuSansMono.ttf);font-weight:700}
html,body{margin:0;background:transparent;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif}
#c{position:absolute;inset:0}
.ch{position:absolute;left:80px;bottom:120px;display:flex;align-items:stretch;color:#fff}
.bar{width:10px;background:#FFAA28;border-radius:5px;transform-origin:bottom}
.pn{background:rgba(14,20,30,.9);padding:22px 36px 20px 30px;border-radius:0 18px 18px 0;box-shadow:0 10px 40px rgba(0,0,0,.45);overflow:hidden}
.tag{font-weight:700;font-size:26px;letter-spacing:4px;color:#FFAA28;text-transform:uppercase}
.tt{font-weight:700;font-size:70px;line-height:1.1;margin-top:6px;white-space:nowrap}
.dots{display:flex;gap:10px;margin-top:16px}.dot{width:34px;height:7px;border-radius:4px;background:rgba(255,255,255,.22)}.dot.on{background:#FFAA28}
.co{position:absolute;left:80px;bottom:120px;background:rgba(14,20,30,.92);border-left:10px solid #58E6FF;border-radius:0 16px 16px 0;padding:22px 34px;box-shadow:0 10px 40px rgba(0,0,0,.45);color:#fff}
.co .k{font-weight:700;font-size:22px;letter-spacing:3px;color:#58E6FF;margin-bottom:6px}
.co .m{font:700 46px DVMono,monospace;color:#FFE658;white-space:pre}
.co .s{font-weight:600;font-size:46px;color:#fff;white-space:pre}
.st{position:absolute;right:110px;top:170px;background:#FFAA28;color:#141008;font-weight:700;font-size:78px;padding:20px 48px;border-radius:22px;box-shadow:0 14px 50px rgba(0,0,0,.5);letter-spacing:2px}
.st small{display:block;font-size:30px;font-weight:600;letter-spacing:0;margin-top:2px;opacity:.85}
.full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,9,15,.78);color:#fff}
.full .w{font-weight:700;font-size:190px;letter-spacing:6px;color:#FFAA28}
.full .d{font-weight:600;font-size:50px;margin-top:24px;color:#e8ecf5}
</style></head><body><div id="c"></div>
<script>
const eo=x=>1-Math.pow(1-x,3), ob=x=>{const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const root=document.getElementById('c');
let EV=[];const els=[];
function build(ev){
 const d=document.createElement('div');d.style.display='none';
 if(ev.type=='chapter'){d.className='ch';
  let dots='';for(let i=1;i<=ev.total;i++)dots+=`<div class="dot ${i<=ev.n?'on':''}"></div>`;
  d.innerHTML=`<div class="bar"></div><div class="pn"><div class="tag">Step ${ev.n} · ${ev.tag}</div><div class="tt">${ev.title}</div><div class="dots">${dots}</div></div>`;}
 else if(ev.type=='callout'){d.className='co';
  d.innerHTML=`<div class="k">${ev.k||''}</div><div class="${ev.mono?'m':'s'}"></div>`;d.dataset.txt=ev.text;}
 else if(ev.type=='stamp'){d.className='st';d.innerHTML=ev.text+(ev.sub?`<small>${ev.sub}</small>`:'');}
 else if(ev.type=='full'){d.className='full';d.innerHTML=`<div class="w"></div><div class="d">${ev.sub}</div>`;d.dataset.txt=ev.text;}
 root.appendChild(d);return d;}
window.load=function(ev){EV=ev;ev.forEach(e=>els.push(build(e)));};
window.render=function(t){
 EV.forEach((e,i)=>{const d=els[i],u=t-e.t0,L=e.dur;
  if(u<0||u>L){d.style.display='none';return}
  d.style.display='';const ai=cl(u/0.5),ao=cl((L-u)/0.4),a=Math.min(eo(ai),eo(ao));
  d.style.opacity=a;
  if(e.type=='chapter'){const bar=d.querySelector('.bar'),pn=d.querySelector('.pn');
   bar.style.transform=`scaleY(${eo(cl(u/0.4))})`;pn.style.transform=`translateX(${(1-eo(ai))*-60}px)`;
   d.style.clipPath=`inset(0 ${100-100*eo(cl(u/0.55))}% 0 0)`; if(ao<1)d.style.clipPath='none';}
  else if(e.type=='callout'){d.style.transform=`translateX(${(1-eo(ai))*-80}px)`;
   const el=d.lastChild,txt=d.dataset.txt,n=Math.floor(cl((u-0.25)/0.7)*txt.length);el.textContent=txt.slice(0,n)+((e.mono&&Math.floor(u*2)%2==0&&n<txt.length+1)?'▌':'');}
  else if(e.type=='stamp'){const s=ob(cl(u/0.45));d.style.transform=`scale(${0.4+0.6*s}) rotate(${(1-s)*-6-2}deg)`;d.style.opacity=ao<1?ao:cl(u/0.15);}
  else if(e.type=='full'){const w=d.querySelector('.w'),txt=d.dataset.txt,n=Math.floor(cl((u-0.2)/0.9)*txt.length);w.textContent=txt.slice(0,n);d.querySelector('.d').style.opacity=cl((u-1.2)/0.5);}
 });};
</script></body></html>
