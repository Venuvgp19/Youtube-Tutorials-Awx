---
# AWX as code with the awx.awx collection. Run on the AWX node (ansible-core from ep05):
#   ansible-galaxy collection install awx.awx:24.6.1
#   export CONTROLLER_HOST=http://192.168.100.102:30080
#   read -s CONTROLLER_OAUTH_TOKEN && export CONTROLLER_OAUTH_TOKEN     # token from Users > admin > Tokens
#   ansible-playbook ep11/awx-config.yml
# Run it twice: the second run changes nothing (idempotent).
- name: Configure AWX as code
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    org: Homelab
    node2: 192.168.100.103
  tasks:
    - name: Project from GitHub
      awx.awx.project:
        name: awx-as-code
        organization: "{{ org }}"
        scm_type: git
        scm_url: https://github.com/Venuvgp19/Youtube-Tutorials-Awx.git
        scm_branch: main
        scm_update_on_launch: true
        wait: true

    - name: Inventory
      awx.awx.inventory:
        name: lab-as-code
        organization: "{{ org }}"

    - name: Host
      awx.awx.host:
        name: "{{ node2 }}"
        inventory: lab-as-code

    - name: Job template
      awx.awx.job_template:
        name: ping (as code)
        description: Created by ep11/awx-config.yml
        organization: "{{ org }}"
        project: awx-as-code
        playbook: ep04/ping.yml
        inventory: lab-as-code
        credentials:
          - lab-ssh
